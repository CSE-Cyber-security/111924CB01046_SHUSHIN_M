<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Application</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <i class="fa-solid fa-clipboard-check"></i>
                <div class="header-text">
                    <h1>To-Do List</h1>
                    <p>Plan • Do • Achieve</p>
                </div>
            </div>
        </header>
        
        <main>
            <div class="input-section">
                <input type="text" id="taskInput" placeholder="Enter a new task...">
                <button id="addBtn"><i class="fa-solid fa-plus"></i> Add Task</button>
            </div>

            <div class="controls">
                <div class="filters">
                    <button class="filter-btn active" data-filter="all">All (<span id="allCount">0</span>)</button>
                    <button class="filter-btn" data-filter="pending">Pending (<span id="pendingCount">0</span>)</button>
                    <button class="filter-btn" data-filter="completed">Completed (<span id="completedCount">0</span>)</button>
                </div>
                <div class="stats">
                    <span id="pendingStat">0 pending</span> | <span id="completedStat">0 completed</span>
                </div>
            </div>

            <ul id="taskList"></ul>
        </main>

        <footer>
            <p>Small steps make big goals! ☺️</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
